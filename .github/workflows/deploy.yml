name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Trigger redeploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              deploy@${{ secrets.HETZNER_HOST }} \
              'bash /var/www/imn/integrity-man-network/deploy/redeploy.sh'

      - name: Smoke check
        run: |
          sleep 5
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 https://www.integritymannetwork.com/)
          echo "Production responded: $code"
          [ "$code" = "200" ]
