name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Package tracked source
        run: git archive --format=tar.gz --output=imn-release.tar.gz HEAD

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          test -n "$SSH_KEY"
          test -n "$SSH_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            imn-release.tar.gz \
            "deploy@$SSH_HOST:/tmp/imn-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz"

      - name: Build and activate release
        env:
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "deploy@$SSH_HOST" \
            "set -euo pipefail
             release='/var/www/imn/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}'
             archive='/tmp/imn-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz'
             mkdir -p \"\$release\"
             tar -xzf \"\$archive\" -C \"\$release\"
             rm -f -- \"\$archive\"
             bash \"\$release/deploy/redeploy.sh\" \"\$release\" '${GITHUB_SHA}'"

      - name: Production smoke checks
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://www.integritymannetwork.com/api/health
          curl --fail --silent --show-error --max-time 15 \
            --output /dev/null https://www.integritymannetwork.com/
