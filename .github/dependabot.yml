version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/integrity-man-network"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      patches:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]
    ignore:
      # Pin major bumps; review manually
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
