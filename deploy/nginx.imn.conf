# Nginx site for Integrity Man Network — HTTP-only (pre-TLS)
# Replaced by deploy/nginx.imn-tls.conf after certbot is run.

limit_req_zone $binary_remote_addr zone=imn_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=imn_api:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name integritymannetwork.com www.integritymannetwork.com
                integritymannetwork.org www.integritymannetwork.org
                _;

    # Allow Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Redirect .org -> www.integritymannetwork.com (HTTP-only phase)
    if ($host ~* ^(www\.)?integritymannetwork\.org$) {
        return 301 http://www.integritymannetwork.com$request_uri;
    }

    # Redirect apex .com -> www
    if ($host = integritymannetwork.com) {
        return 301 http://www.integritymannetwork.com$request_uri;
    }

    # ── Security headers (no HSTS until HTTPS) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Limits ──
    client_max_body_size 25m;
    client_body_buffer_size 1m;
    keepalive_timeout 65s;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               application/wasm font/woff font/woff2;

    # ── Logging ──
    access_log /var/log/nginx/imn.access.log;
    error_log  /var/log/nginx/imn.error.log warn;

    # ── Stripe webhooks: pass raw body, no buffering ──
    location = /api/webhooks/stripe {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location = /api/webhooks/paystack {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location ~ ^/api/auth/ {
        limit_req zone=imn_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/api/ {
        limit_req zone=imn_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
