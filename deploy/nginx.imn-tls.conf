# Nginx site for Integrity Man Network
# Place at /etc/nginx/sites-available/imn and symlink into sites-enabled

# Rate-limit auth + admin
limit_req_zone $binary_remote_addr zone=imn_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=imn_api:10m rate=30r/s;

# ── SSL hardening (defaults from /etc/nginx/nginx.conf already set TLS protocols/ciphers) ──
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

server {
    listen 80;
    listen [::]:80;
    server_name integritymannetwork.com www.integritymannetwork.com
                integritymannetwork.org www.integritymannetwork.org;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://www.integritymannetwork.com$request_uri;
    }
}

# .org HTTPS -> .com canonical (cert is issued for .org names too)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name integritymannetwork.org www.integritymannetwork.org;
    ssl_certificate     /etc/letsencrypt/live/integritymannetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integritymannetwork.com/privkey.pem;
    return 301 https://www.integritymannetwork.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name integritymannetwork.com;
    # Cert is shared (added to both names by certbot)
    ssl_certificate     /etc/letsencrypt/live/integritymannetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integritymannetwork.com/privkey.pem;
    return 301 https://www.integritymannetwork.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.integritymannetwork.com;

    ssl_certificate     /etc/letsencrypt/live/integritymannetwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/integritymannetwork.com/privkey.pem;
    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Limits ──
    client_max_body_size 25m;
    client_body_buffer_size 1m;
    keepalive_timeout 65s;

    # ── Gzip / Brotli ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               application/wasm font/woff font/woff2;

    # ── Logging ──
    access_log /var/log/nginx/imn.access.log;
    error_log  /var/log/nginx/imn.error.log warn;

    # ── Stripe webhooks: pass raw body, no buffering ──
    location = /api/webhooks/stripe {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # ── Auth endpoints: rate-limited ──
    location ~ ^/api/auth/ {
        limit_req zone=imn_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Other API: looser rate-limit ──
    location ~ ^/api/ {
        limit_req zone=imn_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # ── Next.js static assets: long cache ──
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── App ──
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
